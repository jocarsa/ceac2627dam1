<!doctype html>
<html lang="es">
  <head>
    <style>
      html,body{width:100%;height:100%;margin:0px;padding:0px;
        display:flex;align-items:center;justify-content:center;font-family:sans-serif;flex-direction:column;}
      textarea{width:300px;padding:10px;border:1px solid lightgray;border-radius:20px;outline:none;transition:all 1s;height:100px;box-sizing:border-box;}
      textarea:focus{background:rgb(200,255,200);}
      form{text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;}
      input{width:40px;height:40px;border-radius:40px;background:green;color:white;border:none;padding:10px;}
    </style>
  </head>
  <body>
    <h1>Amable</h1>
    <form action="/procesa" method="POST">
      <textarea name="peticion"></textarea>
      <input type="submit" value=">">
    </form>
  </body>
</html>
