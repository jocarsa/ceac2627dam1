{% extends 'base.html' %}{% block content %}<section class="panel auth"><h2>{{ title }}</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Usuario</label><input name="nombre" required minlength="3" maxlength="40" autocomplete="username"><label>Contraseña</label><input type="password" name="password" required minlength="8" autocomplete="{{ 'new-password' if action == 'registro' else 'current-password' }}"><p><button>{{ title }}</button></p></form><p class="muted">{% if action == 'login' %}¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>{% else %}¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>{% endif %}</p></section>{% endblock %}
