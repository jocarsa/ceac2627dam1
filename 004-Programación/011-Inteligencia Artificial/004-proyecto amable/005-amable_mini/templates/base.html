<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Amable' }}</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e9eef7;background:#101522}*{box-sizing:border-box}body{margin:0}a{color:#90c7ff;text-decoration:none}button,input,textarea{font:inherit}button,.btn{background:#5b95ed;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;display:inline-block}button:hover,.btn:hover{filter:brightness(1.12)}input,textarea{background:#171e30;border:1px solid #36435a;border-radius:9px;padding:12px;color:#fff;width:100%}textarea{resize:vertical;min-height:115px}label{display:block;margin:14px 0 7px;color:#bbc8dc}.shell{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h1{margin:0;font-size:24px}.panel{background:#1b2435;border:1px solid #303d53;border-radius:16px;padding:22px}.muted{color:#a3b0c4}.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}.stack{display:grid;gap:12px}.item{padding:14px;border:1px solid #36435a;border-radius:10px;display:block}.item:hover{background:#26354d}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small{font-size:13px}.danger{background:#963f4d}.secondary{background:#33445d}.notice{padding:12px;border-radius:9px;background:#423444;margin-bottom:15px}iframe{background:white;width:100%;height:550px;border:0;border-radius:8px}.preview{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:540px;overflow:auto;background:#101522;padding:16px;border-radius:10px}.auth{max-width:420px;margin:9vh auto}.history{max-height:580px;overflow:auto}.history form{display:inline}.history .item{margin-bottom:10px}.inline{display:flex;gap:8px}.inline input{min-width:0}@media(max-width:850px){.grid{grid-template-columns:1fr}.shell{padding:12px}}
</style></head><body><main class="shell"><header class="top"><h1><a href="{{ url_for('index') }}">✦ Amable</a></h1>{% if session.get('uid') %}<form method="post" action="{{ url_for('salir') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="secondary">Cerrar sesión</button></form>{% endif %}</header>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
