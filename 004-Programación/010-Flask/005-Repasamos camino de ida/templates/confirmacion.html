
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Formulario recibido correctamente</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(
      135deg,
      #0f172a,
      #1e3a5f,
      #0f766e
    );
    overflow: hidden;
  }

  /* Luces ambientales */

  .luz {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    animation: flotar 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  .luz1 {
    background: #38bdf8;
    top: -180px;
    left: -120px;
  }

  .luz2 {
    background: #34d399;
    bottom: -200px;
    right: -100px;
    animation-delay: -3s;
  }

  @keyframes flotar {
    from { transform: translate(0, 0); }
    to { transform: translate(70px, 50px); }
  }

  /* Tarjeta */

  .tarjeta {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    padding: 55px 40px 40px;
    text-align: center;
    background: rgba(255,255,255,0.97);
    border-radius: 24px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.3),
      0 0 0 1px rgba(255,255,255,0.3);
    animation: aparecer 0.8s cubic-bezier(.2,1.5,.4,1) both;
  }

  @keyframes aparecer {
    from {
      opacity: 0;
      transform: translateY(60px) scale(0.85);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Icono de éxito */

  .icono {
    width: 110px;
    height: 110px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: linear-gradient(135deg,#10b981,#059669);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 15px 35px rgba(16,185,129,0.3);
    animation: pulso 2.5s ease-in-out infinite;
  }

  @keyframes pulso {
    0%,100% {
      box-shadow: 0 0 0 0 rgba(16,185,129,0.2);
    }
    50% {
      box-shadow: 0 0 0 18px rgba(16,185,129,0);
    }
  }

  .icono svg {
    width: 60px;
    height: 60px;
  }

  .check {
    fill: none;
    stroke: white;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 80;
    stroke-dashoffset: 80;
    animation: dibujar 0.7s ease forwards 0.6s;
  }

  @keyframes dibujar {
    to { stroke-dashoffset: 0; }
  }

  /* Tipografía */

  .etiqueta {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 30px;
    background: #d1fae5;
    color: #047857;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  h1 {
    margin: 22px 0 15px;
    font-size: 32px;
    line-height: 1.2;
    color: #0f172a;
    letter-spacing: -1px;
  }

  p {
    color: #64748b;
    font-size: 16px;
    line-height: 1.8;
    margin: 0;
  }

  .separador {
    height: 1px;
    background: #e2e8f0;
    margin: 30px 0;
  }

  .detalle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 30px;
  }

  .punto {
    width: 9px;
    height: 9px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 0 5px #d1fae5;
  }

  /* Botón */

  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 17px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#0f766e,#059669);
    color: white;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(5,150,105,0.25);
  }

  .boton:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(5,150,105,0.35);
  }

  .boton span {
    transition: transform 0.3s;
  }

  .boton:hover span {
    transform: translateX(5px);
  }

  .pie {
    margin-top: 25px;
    font-size: 12px;
    color: #94a3b8;
  }

  /* Confeti */

  .particula {
    position: fixed;
    z-index: 3;
    width: 8px;
    height: 12px;
    top: -20px;
    pointer-events: none;
    animation: caer linear forwards;
  }

  @keyframes caer {
    to {
      transform: translateY(110vh) rotate(900deg);
      opacity: 0;
    }
  }

  @media(max-width:500px) {
    .tarjeta {
      padding: 40px 25px 30px;
    }

    h1 {
      font-size: 27px;
    }
  }

  @media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }

    .check {
      stroke-dashoffset: 0;
    }
  }
</style>
</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<main class="tarjeta">

  <div class="icono">
    <svg viewBox="0 0 60 60" aria-hidden="true">
      <path
        class="check"
        d="M13 31 L25 43 L48 17"
      />
    </svg>
  </div>

  <div class="etiqueta">
    Operación completada
  </div>

  <h1>¡Todo perfecto!</h1>

  <p>
    Tu formulario ha sido recibido
    <strong>correctamente</strong>.
    <br>
    Gracias por confiar en nosotros.
    Hemos registrado tu información
    y la procesaremos lo antes posible.
  </p>

  <div class="separador"></div>

  <div class="detalle">
    <div class="punto"></div>
    Solicitud enviada con éxito
  </div>

  <a href="/" class="boton">
    Volver al inicio
    <span>→</span>
  </a>

  <div class="pie">
    Ya puedes cerrar esta ventana con tranquilidad.
  </div>

</main>

<script>
  // Confeti de celebración

  function lanzarConfeti() {
    const colores = [
      "#10b981",
      "#38bdf8",
      "#fbbf24",
      "#f472b6",
      "#a78bfa",
      "#ffffff"
    ];

    for (let i = 0; i < 90; i++) {
      const particula = document.createElement("div");

      particula.className = "particula";

      particula.style.left = Math.random() * 100 + "vw";

      particula.style.background =
        colores[Math.floor(Math.random() * colores.length)];

      particula.style.animationDuration =
        (2.5 + Math.random() * 3) + "s";

      particula.style.animationDelay =
        Math.random() * 1.5 + "s";

      particula.style.borderRadius =
        Math.random() > 0.5 ? "50%" : "2px";

      document.body.appendChild(particula);

      particula.addEventListener("animationend", () => {
        particula.remove();
      });
    }
  }

  if (!window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches) {
    window.addEventListener("load", () => {
      setTimeout(lanzarConfeti, 400);
    });
  }
</script>

</body>
</html>
