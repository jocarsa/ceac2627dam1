<!doctype html>
<html lang="es">
  <head>
    <title>Admin panel</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/estilo.css">
  </head>
  <body id="admin">
    <div id="izquierda">
      <a href="/formulario">Nuevo articulo</a>
      <a href="/tabla">Listado de articulos</a>
    </div>
    <div id="derecha">
      
    <table>
      <thead>
        <tr>
          <th>Titulo</th>
          <th>Fecha</th>
          <th>Contenido</th>
        </tr>
      </thead>
      <tbody>
        
        {% for articulo in tepasolosarticulos %}
        <tr>
          <td>{{articulo.titulo}}</td>
          <td>{{articulo.fecha}}</td>
          <td>{{articulo.contenido}}</td>
        </tr>
        {% endfor %}
        
      </tbody>
    </table>

    </div>
  </body>
</html>
