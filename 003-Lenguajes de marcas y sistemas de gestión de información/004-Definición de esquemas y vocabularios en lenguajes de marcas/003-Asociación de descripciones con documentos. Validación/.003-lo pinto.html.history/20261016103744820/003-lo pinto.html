<!doctype html>
<html>
  <head>
    <title>El blog de Jose Vicente</title>
    <meta charset="utf-8">
  </head>
  <body>
    <header>
      <h1>El blog de Jose Vicente</h1>
    </header>
    <main>
      <!-- Quiero meter aqui los articulos -->
      
    </main>
    <footer>
    </footer>
    <script>
      fetch("blog.json")
      .then(function(resultado){return resultado.json()}) // Lo que viene es un json
      .then(function(datos){
      	console.log(datos)
        let principal = document.querySelector("main")
        datos.forEach(function(articulo){ // Para cada uno de los artículos:
        	principal.innerHTML += `
          	<article>
            	<h3>`+articulo.titulo+`</h3>
              <time>`+articulo.fecha+`</time>
              <p></p>
            </article>
          `
        })
        
      })
    </script>
  </body>
</html>
