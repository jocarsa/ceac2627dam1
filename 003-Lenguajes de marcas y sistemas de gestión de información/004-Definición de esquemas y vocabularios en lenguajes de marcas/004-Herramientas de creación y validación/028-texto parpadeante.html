<!doctype html>
<html>
  <head>
    <style>
      h1{
      	color:red;
        animation:parpadea 10s;
        width:100px;
        text-align:center:
      }
      @keyframes parpadea{
        0%{color:red;transform:scale(1);}
        5%{color:white;transform:scale(0.2);}
        10%{color:red;transform:scale(1);}
        15%{color:white;transform:scale(0.2);}
        20%{color:red;transform:scale(1);}
        25%{color:white;transform:scale(0.2);}
        30%{color:red;transform:scale(1);}
        35%{color:white;transform:scale(0.2);}
        40%{color:red;transform:scale(1);}
        45%{color:white;transform:scale(0.2);}
        50%{color:red;transform:scale(1);}
        55%{color:white;transform:scale(0.2);}
        60%{color:red;transform:scale(1);}
        65%{color:white;transform:scale(0.2);}
        70%{color:red;transform:scale(1);}
        75%{color:white;transform:scale(0.2);}
        80%{color:red;transform:scale(1);}
        85%{color:white;transform:scale(0.2);}
        90%{color:red;transform:scale(1);}
        95%{color:white;transform:scale(0.2);}
      }
    </style>
  </head>
  <body>
    <h1>Oferta</h1>
  </body>
</html>
