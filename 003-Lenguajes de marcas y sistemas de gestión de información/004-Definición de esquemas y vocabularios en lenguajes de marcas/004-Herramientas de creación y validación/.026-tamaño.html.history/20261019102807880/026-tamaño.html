<!doctype html>
<html>
  <head>
    <style>
      #rojo{
      	width:200px;
        height:200px;
        background:red;
        animation:cambiacolor 10s;
      }
      @keyframes cambiacolor{
        0%{
          background:red;
        	width:200px;
          height:200px;
        }
        100%{
          background:blue;
        	width:50px;
          height:50px;
        }
      }
    </style>
  </head>
  <body>
    <div id="rojo"></div>
  </body>
</html>
