<!doctype html>
<html>
  <head>
    <style>
      h1{
      	color:red;
        animation:parpadea 10s;
      }
      @keyframes parpadea{
        0%{color:red;}
        5%{color:white;}
        10%{color:red;}
        15%{color:white;}
        20%{color:red;}
        25%{color:white;}
        30%{color:red;}
        35%{color:white;}
        40%{color:red;}
        45%{color:white;}
        50%{color:red;}
        55%{color:white;}
        60%{color:red;}
        65%{color:white;}
        70%{color:red;}
        75%{color:white;}
        80%{color:red;}
        85%{color:white;}
        90%{color:red;}
        95%{color:white;}
      }
    </style>
  </head>
  <body>
    <h1>Oferta</h1>
  </body>
</html>
