<!doctype html>
<html>
  <head>
    <style>
      @font-face {
        font-family: jocarsa;
        src: url("https://jocarsa.com/jocarsa.ttf");
      }
      html,body{width:100%;height:100%;padding:0px;margin:0px;background:orange;
      display:flex;align-items:center;justify-content:center;gap:20px;
      font-family:sans-serif;font-family:jocarsa,ubuntu;}
      form{width:100px;height:200px;background:white;padding:20px;
      display:flex;flex-direction:column;justify-content:center;gap:10px;
      border-radius:20px;box-shadow:0px 5px 10px rgba(0,0,0,0.3);}
      div{width:200px;height:200px;background:white;padding:20px;
      display:flex;flex-direction:column;justify-content:center;gap:10px;
      border-radius:20px;box-shadow:0px 5px 10px rgba(0,0,0,0.3);align-items:center;
      color:orange;}
      input{border:none;outline:none;background:lightgray;padding:5px;
        border-radius:5px;
      box-shadow:0px 2px 4px rgba(0,0,0,0.1) inset;background:orange;color:white;
      font-size:10px;font-family:jocarsa,ubuntu;}
      input[type=submit]{box-shadow:0px 2px 4px rgba(0,0,0,0.3);}
      h1{font-size:24px;}
      p{font-size:12px;}
      .indigo{color:indigo;}
    </style>
    <meta charset="utf-8">
  </head>
  <body>
    <div>
      <h1><span class="indigo">jocarsa</span> | login</h1>
      <p>Crea tus propios inicios de sesión</p>
    </div>
    <form>
      <img src="https://static.jocarsa.com/logos/orange.svg">
      <input type="text" placeholder="usuario:" name="usuario">
      <input type="password" placeholder="contraseña:" name="contrasena">
      <input type="submit">
    </form>
  </body>
</html>
