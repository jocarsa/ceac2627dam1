<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <article>
      <p>¿Qué lenguaje de programación sufrió ayer un apocalipsis?</p>
      <button valor="correcto">PHP</button>
      <button valor="incorrecto">Python</button>
      <button valor="incorrecto">HTML</button>
      <button valor="incorrecto">Javascript</button>
    <article>
    <hr>
      <article>
      <p>¿Qué lenguaje de programación revela tu código al navegador?</p>
      <button valor="correcto">Javascript</button>
      <button valor="incorrecto">PHP</button>
      <button valor="incorrecto">Python</button>
      <button valor="incorrecto">MySQL</button>
    <article>
    <hr>
    <script>
     
      // Selecciono todos los botones
      let botones = document.querySelectorAll("button");
      // Recorro cada uno de los botones
      botones.forEach(function(boton){
        // Escucho qué ocurre cuando el usuario hace click
      	boton.onclick = function(){
          // Capturo el estado del boton
        	let estado = boton.getAttribute("valor")
          // Si el estado es correcto
          if(estado == "correcto"){
            // Te pongo el fondo verde
          	boton.style.background = "green"
          // Pero si el estado es incorrecto
          }else if(estado == "incorrecto"){
            // te pongo el fondo rojo
          	boton.style.background = "red"
          }
        }
      })
    </script>
  </body>
</html>
