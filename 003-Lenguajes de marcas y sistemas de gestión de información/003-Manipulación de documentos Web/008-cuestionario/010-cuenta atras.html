<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <script>
      // Creo unos segundos iniciales
      let tiempo = 30
      // Dentro de un segundo ejecuta bucle
     	let temporizador = setTimeout("bucle()",1000)
      // Hola yo soy bucle
      function bucle(){
        // Disminuyo el contador
        tiempo--;
        // Escribo un mensaje en consola
        console.log(tiempo)
        // Cuando el tiempo se acaba
        if(tiempo < 0){
        	alert("El examen ha acabado")
        }
        // Quita la alarma del movil
      	clearTimeout(temporizador)
        // Pon otra para dentro de un segundo
        // Ojo que me estoy llamando a mi mismo
        temporizador = setTimeout("bucle()",1000)
      }
    </script>
  </body>
</html>
