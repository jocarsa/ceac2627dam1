<!doctype html>
<html>
  <head>
    <style>
    </style>
  </head>
  <body>
    <script>
      // AND se representa como && (mayus 6)
      // OR se representa como || (alt gr 1)
      
      document.write(4 == 4 && 3 == 3 && 2 == 2);
      document.write("<br>");
      document.write(4 == 4 && 3 == 3 && 2 == 1);
      document.write("<br>");
      document.write("<br>");
      document.write(4 == 4 || 3 == 3 || 2 == 2);
      document.write("<br>");
      document.write(4 == 4 || 3 == 3 || 2 == 1);
      document.write("<br>");
      document.write(4 == 4 || 3 == 2 || 2 == 1);
      document.write("<br>");
      document.write(4 == 3 || 3 == 2 || 2 == 1);
    </script>
  </body>
</html>
