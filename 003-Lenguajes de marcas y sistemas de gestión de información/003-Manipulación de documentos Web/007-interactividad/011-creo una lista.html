<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <button value="15" nombre="Gafas modelo 1">Gafas modelo 1 - 15€</button>
    <button value="25" nombre="Gafas modelo 2">Gafas modelo 2 - 25€</button>
    <button value="30" nombre="Gafas modelo 3">Gafas modelo 3 - 30€</button>
    <button value="40" nombre="Gafas modelo 4">Gafas modelo 4 - 40€</button>
    <div></div>
    <script>
      // Selecciono el escenario
      let escenario = document.querySelector("div")
      // Selecciono todos los botones
      let botones = document.querySelectorAll("button")
      // Creo una variable que al principio vale cero
      let total = 0;
      // Creo una lista vacia para guardar los productos
      let lista = []
      // Selecciono uno a uno
      botones.forEach(function(boton){
      	// Cuando hago click en cada boton
        boton.onclick = function(){
          // al total le sumo lo que vale el boton
        	total += boton.getAttribute("value")*1 // Implicita
          // Pinto el total en el escenario
          escenario.textContent = total
        }
      })
      	
    </script>
  </body>
</html>
