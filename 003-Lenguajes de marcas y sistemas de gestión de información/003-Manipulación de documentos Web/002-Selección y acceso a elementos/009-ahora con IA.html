<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IVA</title>

    <style>
      *{
        box-sizing:border-box;
      }

      body{
        margin:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, #dbeafe, transparent 40%),
          radial-gradient(circle at bottom right, #ede9fe, transparent 40%),
          #f8fafc;
        color:#1e293b;
      }

      .calculadora{
        width:420px;
        max-width:calc(100% - 40px);
        background:white;
        padding:40px;
        border-radius:24px;
        box-shadow:
          0 25px 50px rgba(15,23,42,0.10),
          0 5px 15px rgba(15,23,42,0.05);
      }

      .icono{
        width:60px;
        height:60px;
        margin:auto;
        margin-bottom:20px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius:18px;
        background:#4f46e5;
        color:white;
        font-size:30px;
        font-weight:bold;
      }

      h1{
        margin:0;
        text-align:center;
        font-size:32px;
        color:#0f172a;
      }

      h2{
        margin:8px 0 35px 0;
        text-align:center;
        font-size:13px;
        font-weight:normal;
        color:#94a3b8;
      }

      label{
        display:block;
        margin-top:20px;
        margin-bottom:8px;
        font-size:14px;
        font-weight:bold;
        color:#475569;
      }

      .campo{
        position:relative;
      }

      input{
        width:100%;
        padding:15px 50px 15px 16px;
        border:2px solid #e2e8f0;
        border-radius:12px;
        outline:none;
        font-size:18px;
        background:#f8fafc;
        transition:0.2s;
      }

      input:focus{
        border-color:#6366f1;
        background:white;
        box-shadow:0 0 0 4px rgba(99,102,241,0.10);
      }

      .unidad{
        position:absolute;
        right:16px;
        top:50%;
        transform:translateY(-50%);
        color:#94a3b8;
        font-weight:bold;
      }

      button{
        width:100%;
        margin-top:28px;
        padding:16px;
        border:0;
        border-radius:12px;
        background:#4f46e5;
        color:white;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.2s;
        box-shadow:0 8px 20px rgba(79,70,229,0.25);
      }

      button:hover{
        background:#4338ca;
        transform:translateY(-2px);
        box-shadow:0 12px 25px rgba(79,70,229,0.30);
      }

      button:active{
        transform:translateY(0);
      }

      .resultados{
        margin-top:30px;
        padding-top:25px;
        border-top:1px solid #e2e8f0;
      }

      .resultado{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:10px 0;
        color:#64748b;
      }

      .resultado span{
        font-weight:bold;
        color:#0f172a;
      }

      .total{
        margin-top:10px;
        padding:18px;
        border-radius:14px;
        background:#eef2ff;
        color:#4338ca;
        font-size:18px;
        font-weight:bold;
      }

      .total span{
        color:#4338ca;
        font-size:24px;
      }

      .pie{
        margin-top:25px;
        text-align:center;
        font-size:11px;
        color:#cbd5e1;
      }
    </style>
  </head>

  <body>

    <main class="calculadora">

      <div class="icono">%</div>

      <h1>Calculadora de IVA</h1>
      <h2>v0.1 · Jose Vicente Carratala</h2>

      <label for="base">Base imponible</label>

      <div class="campo">
        <input type="number" id="base" placeholder="Ej. 100">
        <span class="unidad">€</span>
      </div>

      <label for="iva">Porcentaje de IVA</label>

      <div class="campo">
        <input type="number" id="iva" placeholder="Ej. 21">
        <span class="unidad">%</span>
      </div>

      <button>Calcular IVA</button>

      <section class="resultados">

        <div class="resultado">
          <div>Base imponible</div>
          <span><span id="resultado_base">0.00</span> €</span>
        </div>

        <div class="resultado">
          <div>IVA</div>
          <span><span id="resultado_iva">0.00</span> €</span>
        </div>

        <div class="resultado total">
          <div>Total</div>
          <span><span id="resultado_total">0.00</span> €</span>
        </div>

      </section>

      <div class="pie">
        Calculadora de IVA · JOCARSA
      </div>

    </main>

    <script>
      // Primero selecciono el boton
      let boton = document.querySelector("button")

      // Ahora escucho lo que le ocurre al boton + funcion
      boton.onclick = function(){

        console.log("ok reconozco que has hecho click en el boton")

        // Ahora tomo datos
        // Creo una variable y le asigno el valor del input
        let base = document.querySelector("#base").value * 1

        // Creo otra variable y le asigno el valor del otro input
        let iva = document.querySelector("#iva").value * 1

        // Ahora hago cálculos
        let total_iva = base * (iva / 100)
        let total = base + total_iva

        // Ahora pinto resultados
        document.querySelector("#resultado_base").textContent = base.toFixed(2)
        document.querySelector("#resultado_iva").textContent = total_iva.toFixed(2)
        document.querySelector("#resultado_total").textContent = total.toFixed(2)
      }
    </script>

  </body>
</html>
